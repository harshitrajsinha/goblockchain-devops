apiVersion: apps/v1
kind: Deployment
metadata:
  name: blc-deployment
  labels:
    app: blc-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blc-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blc-server
    spec:
      containers:
      - name: blc-container
        image: harshitrajsinha/gobl/blcserver:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000

